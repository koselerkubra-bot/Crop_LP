  .cat-bar-item:hover { filter: brightness(1.12); }
  .cat-bar-item.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; background: #fff; border-radius: 3px 3px 0 0; }

  .info-banner:hover .info-banner-cta { text-decoration: underline; }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--syn-border); }

  .card-top { height: 4px; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 768px) {

    .crop-nav-label { display: none; }

    .target-dose, .target-phi { justify-self: start; }
    .faq-q { padding: 13px 16px; font-size: 13px; }
    .faq-a { padding: 0 16px 14px; font-size: 13px; }
  }

function ProductCard({ product, index, catColor }) {
  const [expanded, setExpanded] = useState(false);
  const maxShow = 3;
  const hasMore = product.targets.length > maxShow;
  const visible = expanded ? product.targets : product.targets.slice(0, maxShow);
  return (
    <div className="product-card" style={{ animationDelay: `${index * 70}ms` }}>
      <div className="card-top" style={{ background: catColor }} />
      <div className="card-header">
        <div>
          <div className="card-name">{product.name}</div>
          <span className="card-badge" style={{ background: catColor }}>{product.badge}</span>
        </div>
        <span className="card-form-tag">{product.formulation}</span>
      </div>
      <div className="card-ai-row"><strong>Aktif Madde: </strong>{product.activeIngredient}</div>
      <div className="card-targets">
        {visible.map((t, i) => (
          <div className="target-row" key={i}>
            <div><span className="target-pest">{t.pest}</span>{t.latin && <span className="target-latin">{t.latin}</span>}</div>
            <span className="target-dose">{t.dose}</span>
            <span className="target-phi">⏱ {t.phi}</span>
          </div>
        ))}
      </div>
      {hasMore && <button className="expand-btn" onClick={() => setExpanded(!expanded)}>{expanded ? "▲ Daha az" : `▼ +${product.targets.length - maxShow} hedef daha`}</button>}
    </div>
  );
}

function ProductSection({ catId, catLabel, catColor, products }) {
  if (!products || products.length === 0) return null;
  return (
    <div>
      <div className="section-header">
        <div className="section-dot" style={{ background: catColor }} />
        <h2 className="section-title">{catLabel}</h2>
        <span className="section-count">{products.length} ürün</span>
      </div>
      <div className="products-grid">
        {products.map((p, i) => <ProductCard key={p.name} product={p} index={i} catColor={catColor} />)}
      </div>
    </div>
  );
}

function FAQSection() {
  const [openIdx, setOpenIdx] = useState(null);
  return (
    <div className="faq-section">
      <div className="faq-header">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="10" fill="#007A3A"/><text x="10" y="14.5" textAnchor="middle" fill="#fff" fontSize="13" fontWeight="700">?</text></svg>
        <h2>Sıkça Sorulan Sorular</h2>
      </div>
      <div className="faq-list">
        {FAQ_ITEMS.map((item, i) => (
          <div key={i} className={`faq-item ${openIdx === i ? "open" : ""}`}>
            <button className="faq-q" onClick={() => setOpenIdx(openIdx === i ? null : i)}>
              <span>{item.q}</span>
              <span className="faq-chevron">▼</span>
            </button>
            {openIdx === i && <div className="faq-a" dangerouslySetInnerHTML={{ __html: item.a }} />}
          </div>
        ))}
      </div>
    </div>
  );
}
